# cargo-audit policy. CI runs `cargo audit --deny warnings`, so every entry here
# needs a reason and a revisit condition.

[advisories]
ignore = [
    # unsafe-libyaml is unmaintained (assigned 2026-10-12). It is a transitive dep
    # of serde_yaml_ng (our only YAML parser, used for provider configs the
    # operator writes themselves), which has no release that drops it. Not a
    # vulnerability; revisit when serde_yaml_ng moves off it or we switch crates.
    "RUSTSEC-2024-0449",
]
