version: 2

# Two ecosystems, for two different risks.
#
# cargo: 434 crates reach every published binary and the container image. `cargo audit` in CI
# catches the ones with a filed advisory; this is what keeps the tree current enough that an
# advisory lands on a version we can actually move off.
#
# github-actions: workflow actions run with `contents: write` and `packages: write` on release, so
# a compromised action is a supply-chain compromise of the published artifacts. Actions are pinned
# by commit SHA rather than tag — a tag is mutable and can be repointed at new code under the same
# name. Pinning gives up automatic updates, so Dependabot is what stops the pins going stale.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for routine bumps; a breaking change still gets its own, where it can be read.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
