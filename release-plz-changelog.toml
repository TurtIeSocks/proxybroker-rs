# release-plz changelog template — extends git-cliff config.
# Docs: https://git-cliff.org/docs/configuration
#
# Kept byte-compatible with zendriver-rs/release-plz-changelog.toml so both projects
# produce changelogs in the same shape.

[changelog]
header = """
# Changelog

All notable changes to this crate documented here. Format: [Keep a
Changelog](https://keepachangelog.com/en/1.1.0/). Adheres to [SemVer](https://semver.org/).

"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first | trim }}\
            {% if commit.breaking %} **(BREAKING)**{% endif %}\
    {% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Changed" },
    # This repo uses `harden(scope):` for security-hardening changes that are neither a
    # user-visible feature nor a bug fix. They matter to anyone deciding whether to upgrade,
    # so they get a group rather than being skipped with the other chores.
    { message = "^harden", group = "Security" },
    # Label release-plz's synthetic dependency-only-bump commit (first-match-wins,
    # so it must precede the generic ^chore skip) instead of leaving a pure
    # lockstep version bump as a silent, contentless version header.
    { message = '^chore: update Cargo\.(toml|lock) dependencies$', group = "Internal" },
    { message = "^docs", skip = true },
    { message = "^test", skip = true },
    { message = "^ci", skip = true },
    { message = "^build", skip = true },
    { message = "^chore", skip = true },
    { message = "^style", skip = true },
]
filter_commits = true
tag_pattern = "v[0-9].*"
